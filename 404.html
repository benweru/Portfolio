<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ben Waweru Maina</title>
    <script>
      // GitHub Pages paths are case-sensitive; send mixed-case links to the lowercase URL.
      (function () {
        var path = window.location.pathname;
        var lower = path.toLowerCase();
        if (lower !== path) {
          window.location.replace(lower + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #141516;
        color: #d0d0d0;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 {
        color: #fff;
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 3rem;
        margin: 0 0 0.5rem;
      }
      a {
        color: #eabe7c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That page doesn't exist. <a id="home-link" href="/portfolio/">Go to the portfolio</a>.</p>
    </main>
  </body>
</html>
